{% extends 'main.html' %}
{% block content %}
<div class="system_header large">
    <h1>Nutrition Fitness Tracker</h1>
</div>
<div class="container">
    <div class="generic_forms_container">
        <h2 class="form_heading_area">Add Required Information</h2>
        <p>These fields can be updated at any time.</p>
        <hr>
        <form method="POST" action="">
            {% csrf_token %}
            <div class="django_forms add">{{info_form.as_p}}</div>
            <input class ="button single" type="submit" value="Save"/>
        </form>
    </div>
</div>
{% endblock content %}
