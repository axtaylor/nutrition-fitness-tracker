{% extends 'main.html' %}
{% block content %}
<div class="system_header large">
    <h1>Nutrition Fitness Tracker</h1>
</div>
<div class="container">
    <form class="generic_forms_container delete" method="POST" action="">
        {% csrf_token %}
        <h3 style="font-weight: 550;">Delete Entry "{{deleting_object.date}}"?</h3>
        <div class="double_buttons">
            <input class="button delete" type="submit" value="Delete"/>
            <a class="button" href="{{request.META.HTTP_REFERER}}">Cancel</a> 
        </div>
    </form>
</div>
{% endblock content %}
