<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1, user-scalable=0">
    {% load static %}
    <link rel="stylesheet" type="text/css" media="screen" href="{% static 'styles/main.css' %}">
    {% load static %}
    <script type="text/javascript" src="{% static 'scripts/navbar.js' %}"></script>
    <title>Nutrition Fitness Tracker</title>
</head>
<body>
    {% if not hide_sidebar %}
        {% include 'navbar.html' %}
        {% load static %}
        <div class="close_navbar"><button><img class="menu_img" src="{% static 'images/menu.png' %}"></div>
    {% endif %}
    {% if messages %}
        <!--
        <div class="messages">
            {% for message in messages %}
                <p{% if message.tags %} class="{{message.tags}}" {% endif %}>{{ message }}</p>
            {% endfor %}
        </div>-->
    {% endif %}
    {% block content %}
    {% endblock %}
</body>
</html>
